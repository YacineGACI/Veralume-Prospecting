<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veralume Prospects</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><path fill="#20D47A" d="M8 12H34L47.5 57V88H30.8Z"/><path fill="#C4F5D8" d="M92 12H66L52.5 57V88H69.2Z"/></svg>
    <a href="#today" data-v="today" aria-label="Today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg><span class="badge" id="badge" hidden>0</span><span class="tip">Today <kbd>g t</kbd></span></a>
    <a href="#leads" data-v="leads" aria-label="Leads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="tip">Leads <kbd>g l</kbd></span></a>
    <a href="#call" data-v="call" aria-label="Call mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><span class="tip">Call mode <kbd>g c</kbd></span></a>
    <a href="#pipeline" data-v="pipeline" aria-label="Pipeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg><span class="tip">Pipeline <kbd>g p</kbd></span></a>
    <a href="#campaigns" data-v="campaigns" aria-label="Campaigns"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7l9 6 9-6"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg><span class="tip">Campaigns <kbd>g m</kbd></span></a>
    <a href="#insights" data-v="insights" aria-label="Insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="tip">Insights <kbd>g i</kbd></span></a>
    <div class="spacer"></div>
    <a href="#settings" data-v="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="tip">Settings</span></a>
    <a href="#" id="pal-open" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span class="tip">Search <kbd>Ctrl K</kbd></span></a>
  </nav>
  <main class="canvas" id="canvas"><div class="loading">Loading…</div></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Lead file"></aside>
<div class="modal" id="modal"><div class="bg" data-close></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="modal" id="palette-m"><div class="bg" data-close></div><div class="palette" role="dialog" aria-label="Search"><input id="pal-in" placeholder="Find a lead, a town, or jump to a view…" autocomplete="off"><div class="pl" id="pal-list"></div></div></div>
<div class="lightbox" id="lightbox" hidden><div><img alt=""><p></p></div></div>
<div class="toast" id="toast" role="status"><span id="toast-t"></span><button id="toast-u" hidden>Undo</button></div>
<canvas class="confetti" id="confetti"></canvas>
<script type="module" src="/static/app.js"></script>
</body>
</html>
